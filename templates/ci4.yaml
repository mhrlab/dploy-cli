# deploy.config.yml
name: CodeIgniter 4 + Nginx

build:
  strategy: hybrid
  buildDir: build
  include:
    - app/**
    - public/**
    - system/**
    - writable/**
    - spark
    - composer.json
    - composer.lock
    - env
  exclude:
    - writable/cache/**
    - writable/logs/**
    - writable/session/**
    - writable/uploads/**
    - writable/debugbar/**
    - tests/**
    - .git/**
    - "*.md"
  shared:
    - .env
    - writable/cache/
    - writable/logs/
    - writable/session/
    - writable/uploads/
    - writable/debugbar/
  sharedDefaults:
    .env: env
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "📦 Installing Composer dependencies without dev tools"
    - composer install --no-dev --optimize-autoloader --no-interaction
  preDeploy:
    - echo "🚀 Running database migrations"
    - php spark migrate --all --force || true
    - echo "🧹 Clearing application cache"
    - php spark cache:clear || true
  postDeploy:
    - echo "🔄 Reloading PHP-FPM and Nginx"
    - sudo systemctl reload php8.4-fpm || sudo systemctl reload php-fpm
    - sudo systemctl reload nginx

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/ci4_app
    port: ${SSH_PORT:-22}
    ssh_key_path: ${SSH_KEY_PATH:-~/.ssh/id_rsa}
    # passphrase: ${DPLOY_PASSPHRASE}
    # password: ${SSH_PASSWORD}
    baseUrl: https://${PROD_HOST:-example.com}
    healthCheckPath: /
    healthGate: true
    autoRollback: true
    maintenanceMode: true
    admin:
      username: root
      # ssh_key_path: ~/.ssh/id_rsa
    provision:
      checkPrerequisites: true
      runtime:
        php: "8.4"
        composer: "2.0"
      dirs:
        - writable/cache
        - writable/logs
        - writable/session
        - writable/uploads
        - writable/debugbar
      permissions:
        mode: "755"
        sharedMode: "775"
        owner: ${PROV_OWNER:-deploy}
        group: ${PROV_GROUP:-www-data}

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/ci4_staging

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/ci4_app
    keepVersions: 7
