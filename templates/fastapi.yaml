# deploy.config.yml
name: 'Python FastAPI + Uvicorn'

build:
  strategy: include
  buildDir: build
  include:
    - app/**
    - requirements.txt
    - run.sh
  exclude:
    - venv/**
    - __pycache__/**
    - tests/**
    - "*.md"
  shared:
    - .env
    - logs/
  sharedDefaults:
    .env: .env.example
  copy:
    - from: run.sh
      to: build/run.sh
      optional: true
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "🐍 Creating virtual environment"
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  preDeploy:
    - echo "🚀 Preparing release on server"
  postDeploy:
    - echo "🚀 Restarting Uvicorn service"
    - sudo systemctl restart fastapi.service

# Database snapshot
# database:
#   enabled: true
#   type: postgres
#   name: fastapi_db
#   user: postgres
#   keep: 5

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/fastapi_app
    port: ${SSH_PORT:-22}
    ssh_key_path: ${SSH_KEY_PATH:-~/.ssh/id_rsa}
    # passphrase: ${DPLOY_PASSPHRASE}
    # password: ${SSH_PASSWORD}
    baseUrl: https://${PROD_HOST:-example.com}
    healthCheckPath: /health
    healthGate: true
    autoRollback: true
    admin:
      username: root
      # ssh_key_path: ~/.ssh/id_rsa
    env:
      ENVIRONMENT: local
      DEBUG: true

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/fastapi_staging
    env:
      ENVIRONMENT: staging
      DEBUG: false

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/fastapi_app
    keepVersions: 7
    env:
      ENVIRONMENT: production
      DEBUG: false
