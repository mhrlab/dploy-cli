# deploy.config.yml
name: Go + Systemd

build:
  strategy: include
  buildDir: build
  include:
    - build/app
    - config/**
    - public/**
    - templates/**
    - migrations/**
  exclude:
    - "*.go"
    - go.mod
    - go.sum
    - tests/**
    - .git/**
    - "*.md"
  shared:
    - .env
    - logs/
    - uploads/
  sharedDefaults:
    .env: .env.example
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "📦 Downloading Go dependencies"
    - go mod download
    - echo "🧪 Running tests"
    - go test ./...
    - echo "🏗️ Cross-compiling Go binary for Linux amd64"
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/app ./cmd/server || CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/app .
  preDeploy:
    - echo "🚀 Preparing release on server"
  postDeploy:
    - echo "🚀 Restarting systemd service"
    - sudo systemctl restart ${APP_NAME:-go-app}

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/go_app
    port: ${SSH_PORT:-22}
    ssh_key_path: ${SSH_KEY_PATH:-~/.ssh/id_rsa}
    # passphrase: ${DPLOY_PASSPHRASE}
    # password: ${SSH_PASSWORD}
    baseUrl: https://${PROD_HOST:-example.com}
    healthCheckPath: /health
    healthGate: true
    autoRollback: true
    admin:
      username: root
      # ssh_key_path: ~/.ssh/id_rsa
    provision:
      checkPrerequisites: true
      runtime:
        go: "1.21"
      dirs:
        - logs
        - uploads
      permissions:
        mode: "755"
        sharedMode: "775"
        owner: ${PROV_OWNER:-deploy}
        group: ${PROV_GROUP:-www-data}
      service:
        type: systemd
        name: ${APP_NAME:-go-app}
        action: restart

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/go_staging

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/go_app
    keepVersions: 7
