# deploy.config.yml
name: Laravel + Vite

build:
  strategy: hybrid
  buildDir: build
  include:
    - app/**
    - bootstrap/**
    - config/**
    - database/**
    - public/**
    - resources/**
    - routes/**
    - artisan
    - composer.json
    - composer.lock
    - package.json
    - vite.config.js
  exclude:
    - node_modules/**
    - storage/**
    - tests/**
    - "*.md"
  shared:
    - .env
    - storage
  sharedDefaults:
    .env: .env.example
  copy:
    - from: public/build
      to: build/public/build
      optional: true
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "📦 Installing Composer dependencies"
    - composer install --no-dev --optimize-autoloader
    - echo "🧩 Installing Node dependencies for Vite"
    - npm ci
    - echo "⚙️ Building front-end assets using Vite"
    - npm run build
  preDeploy:
    - echo "🚀 Running database migrations"
    - php artisan migrate --force
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
  postDeploy:
    - echo "🔄 Reloading PHP-FPM OPcache and Nginx gracefully"
    - sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm
    - sudo systemctl reload nginx
    - echo "🔄 Gracefully restarting background queue workers"
    - php artisan queue:restart || true

# Pre-deployment database backup configuration
database:
  enabled: true
  type: mysql # mysql | postgres | sqlite
  name: ${DB_DATABASE:-laravel}
  user: ${DB_USERNAME:-root}
  password: ${DB_PASSWORD}
  keep: 5

# Team notifications
# notifications:
#   - channel: slack
#     url: ${SLACK_WEBHOOK_URL}
#     on: [start, success, failure, rollback]

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/laravel_app
    port: ${SSH_PORT:-22}
    ssh_key_path: ${SSH_KEY_PATH:-~/.ssh/id_rsa}
    # passphrase: ${DPLOY_PASSPHRASE}
    # password: ${SSH_PASSWORD}
    baseUrl: https://${PROD_HOST:-example.com}
    healthCheckPath: /up
    healthGate: true
    autoRollback: true
    maintenanceMode: true # Toggles maintenance mode during migration & cutover
    admin:
      username: root
      # ssh_key_path: ~/.ssh/id_rsa
    env:
      APP_ENV: production
      APP_DEBUG: true
      PHP_VERSION: "8.2"

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/staging_app
    env:
      APP_ENV: staging
      APP_DEBUG: false

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    # For multi-server clusters:
    # hosts:
    #   - 10.0.0.10
    #   - 10.0.0.11
    # strategy: rolling
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/laravel_app
    keepVersions: 7
    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
