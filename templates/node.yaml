# deploy.config.yml
name: Node.js + PM2

build:
  strategy: include
  buildDir: build
  include:
    - dist/**
    - package.json
    - package-lock.json
  exclude:
    - node_modules/**
    - tests/**
  shared:
    - .env
  sharedDefaults:
    .env: .env.example
  copy:
    - from: ecosystem.config.js
      to: build/ecosystem.config.js
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "📦 Installing dependencies"
    - npm ci
  postBuild:
    - echo "🏗️ Building the project"
    - npm run build
  preDeploy:
    - echo "🗜️ Packaging build files"
    - tar -czf node_app.tar.gz build
  postDeploy:
    - echo "🚀 Restarting PM2 process"
    - pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/node_app
    env:
      NODE_ENV: development

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/node_staging
    env:
      NODE_ENV: staging

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/node_app
    keepVersions: 7
    env:
      NODE_ENV: production
      PORT: 3000
