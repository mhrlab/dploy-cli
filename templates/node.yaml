# deploy.config.yml
name: Node.js + PM2

build:
  strategy: include
  buildDir: build
  include:
    - dist/**
    - package.json
    - package-lock.json
  exclude:
    - node_modules/**
    - tests/**
    - "*.md"
  shared:
    - .env
    - logs/
  sharedDefaults:
    .env: .env.example
  copy:
    - from: ecosystem.config.js
      to: build/ecosystem.config.js
      optional: true
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "📦 Installing dependencies"
    - npm ci
    - echo "🏗️ Building the project"
    - npm run build
  preDeploy:
    - echo "🚀 Preparing release on server"
  postDeploy:
    - echo "🔄 Reloading PM2 processes gracefully (Zero-Downtime)"
    - pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js || sudo systemctl restart node-app

# Optional pre-deploy database snapshot
# database:
#   enabled: true
#   type: postgres # mysql | postgres | sqlite
#   name: myapp_prod
#   user: postgres
#   keep: 5

# Optional deployment alerts
# notifications:
#   - channel: slack
#     url: ${SLACK_WEBHOOK_URL}
#     on: [start, success, failure, rollback]

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/node_app
    port: ${SSH_PORT:-22}
    ssh_key_path: ${SSH_KEY_PATH:-~/.ssh/id_rsa}
    # passphrase: ${DPLOY_PASSPHRASE} # Uncomment if SSH key has a passphrase
    # password: ${SSH_PASSWORD}       # Uncomment if using password authentication
    baseUrl: https://${PROD_HOST:-localhost:3000}
    healthCheckPath: /health
    healthGate: true
    autoRollback: true
    maintenanceMode: false
    admin:
      username: root
      # ssh_key_path: ~/.ssh/id_rsa
    provision:
      checkPrerequisites: true
      runtime:
        node: "20"
      permissions:
        mode: "755"
        sharedMode: "775"
    env:
      NODE_ENV: development

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/node_staging
    env:
      NODE_ENV: staging

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    # For multi-server clusters, replace host with hosts list:
    # hosts:
    #   - 10.0.0.1
    #   - 10.0.0.2
    # strategy: rolling # parallel | rolling
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/node_app
    keepVersions: 7
    env:
      NODE_ENV: production
      PORT: 3000
