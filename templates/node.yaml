# deploy.config.yml
name: Node.js + PM2

build:
  strategy: include
  buildDir: build
  include:
    - dist/**
    - package.json
    - package-lock.json
  exclude:
    - node_modules/**
    - tests/**
  shared:
    - .env
  sharedDefaults:
    .env: .env.example
  copy:
    - from: ecosystem.config.js
      to: build/ecosystem.config.js
  cleanAfterDeploy: true

hooks:
  preBuild:
    - echo "📦 Installing dependencies"
    - npm ci
    - echo "🏗️ Building the project"
    - npm run build
  preDeploy:
    - echo "🚀 Preparing release on server"
  postDeploy:
    - echo "🔄 Reloading PM2 processes gracefully (Zero-Downtime)"
    - pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js

environments:
  default:
    keepVersions: 5
    deployTo: /var/www/node_app
    port: ${SSH_PORT:-22}
    ssh_key_path: ${SSH_KEY_PATH:-~/.ssh/id_rsa}
    # password: ${SSH_PASSWORD} # Uncomment if using password authentication
    baseUrl: https://${PROD_HOST:-localhost:3000}
    healthCheckPath: /health
    provision:
      checkPrerequisites: true
      runtime:
        node: "20"
      permissions:
        mode: "755"
        sharedMode: "775"
    env:
      NODE_ENV: development

  staging:
    extends: default
    host: ${STAGING_HOST:-staging.example.com}
    username: ${STAGING_USER:-deploy}
    deployTo: /var/www/node_staging
    # ssh_key_path: ${STAGING_SSH_KEY_PATH:-~/.ssh/id_rsa}
    # password: ${STAGING_PASSWORD}
    env:
      NODE_ENV: staging

  production:
    extends: default
    host: ${PROD_HOST:-prod.example.com}
    username: ${PROD_USER:-deploy}
    deployTo: /var/www/node_app
    keepVersions: 7
    # ssh_key_path: ${PROD_SSH_KEY_PATH:-~/.ssh/id_rsa}
    # password: ${PROD_PASSWORD}
    env:
      NODE_ENV: production
      PORT: 3000
