server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAINS}};

    # Application Logs
    access_log /var/log/nginx/{{PRIMARY_DOMAIN}}.access.log;
    error_log /var/log/nginx/{{PRIMARY_DOMAIN}}.error.log warn;

    root {{ROOT_DIR}};
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maintenance Mode Check (managed by dploy down / dploy up)
    if (-f {{DEPLOY_TO}}/shared/maintenance.json) {
        return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root {{DEPLOY_TO}}/shared;
        try_files /maintenance.html =503;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA routing: fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
